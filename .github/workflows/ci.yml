name: Public Demo Tests and Safety Scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic-data tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify portfolio sanitization
        run: python scripts/check_public_safety.py
